server:
  port: 9000

spring:
  application:
    name: auth-server

  datasource:
    url: jdbc:mysql://localhost:3306/auth_server_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: user
    password: user123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect 
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    user: user
    password: user123
    url: jdbc:mysql://localhost:3306/auth_server_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

  security:
    oauth2:
      authorizationserver:
        issuer-uri: http://localhost:9000
        jdbc:
          authorization-schema: OAUTH2_AUTHORIZATION
          authorization-consent-schema: OAUTH2_AUTHORIZATION_CONSENT
        client:
          resource-server-client:
            registration:
              client-id: resource-server-service
              client-secret: "{noop}secret123"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - apis:read
                - apis:write
            access-token-time-to-live: 15m
          app-web-client:
            registration:
              client-id: app-web-client
              client-secret: "{noop}app-web-secret123"
              authorization-grant-types:
                - authorization_code
                - refresh_token
              client-authentication-methods:
                - client_secret_basic
              redirect-uris: 
                - http://localhost:9080/login/oauth2/code/app-web-client
                - https://oauth.pstmn.io/v1/callback
              post-logout-redirect-uris:
                - http://localhost:9080?logout-success
              scopes:
                - apis:read
                - apis:write
                - openid
            require-authorization-consent: true
            require-proof-key: false
            token:
              access-token-time-to-live: 15m
              refresh-token-time-to-live: 1h
          app-web-m2m-client:
            registration:
              client-id: app-web-m2m
              client-secret: "{noop}app-web-m2m-123"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - apis:read
                - apis:write
            token:
              access-token-time-to-live: 15m
               
jwt:
  issuer-uri: http://localhost:9000

logging:
  level:
    org.springframework.security: TRACE

